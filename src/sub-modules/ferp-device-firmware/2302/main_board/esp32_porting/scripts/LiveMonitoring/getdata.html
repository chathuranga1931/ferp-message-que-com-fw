<script>

    /*
     * Neet to get the current settings from the device 
     */
     function csvToArray(str, delimiter = ",") {

        // slice from start of text to the first \n index
        // use split to create an array from string by delimiter
        const headers = str.slice(0, str.indexOf("\r\n")).split(delimiter);

        // slice from \n index + 1 to the end of the text
        // use split to create an array of each csv value row
        const rows = str.slice(str.indexOf("\r\n") + 1).split("\r\n");

        // Map the rows
        // split values from each row into an array
        // use headers.reduce to create an object
        // object properties derived from headers:values
        // the object passed as an element of the array
        const arr = rows.map(function (row) {
            const values = row.split(delimiter);
            const el = headers.reduce(function (object, header, index) {
                object[header] = values[index];
                    return object;
                }, {});
            return el;
        });

        // return the array
        return arr;
    }

    function readFile() {
        // e.preventDefault();
        const input = "iplist.csv";
        const reader = new FileReader();

        var request = new XMLHttpRequest();
        request.open('GET', "iplist.csv", true);
        request.responseType = 'blob';
        request.onload = function() {
            var reader = new FileReader();
            reader.readAsDataURL(request.response);
            reader.onload =  function(e){
                console.log('DataURL:', e.target.result);
                const text = e.target.result;
                const data = csvToArray(text);
                document.write(JSON.stringify(data));
            };
        };
        request.send();
    }

    var DeviceList;

    function onLoadBody(){
        fetch("iplist.csv")
            .then(response => response.text())
            .then(ab => {
                // do stuff with `ArrayBuffer` representation of file
                DeviceList = csvToArray(ab);
                createTable();
                getAllDataOnce();
                const interval1 = setInterval(loop, 1000);
                const interval2 = setInterval(getAllDataOnce, 15*1000);
            })
        .catch(err => console.log(err));
    }

    function createTable(){

        for (let i = 0; i < DeviceList.length; i++) {
            let idx = DeviceList[i].idx;
            table_cell = document.getElementById("tableCell"+idx);

            tag_all = document.createElement("label");
            tag_all.id = "id_tableCell"+ idx +"_allData";
            table_cell.appendChild(tag_all);

            tag_live = document.createElement("label");
            tag_live.id = "id_tableCell"+ idx +"_live";
            table_cell.appendChild(tag_live);

            tag_counter = document.createElement("label");
            tag_counter.id = "id_tableCell"+ idx +"_main_thread_counter";
            table_cell.appendChild(tag_counter);
        }
    }

    function getData(ipAddress, idx, name){

                "<br>Power On Time <t>: " + obj.power_on_time +

                "<br>WiFi IP <t>: " + obj.ipaddress + 
                "<br>WiFi RSSI <t>: " + obj.rssi +
                "<br>SD Card Size <t>: " + obj.sd_card_size +
                "<br>FW Version <t>: " + obj.device_version +
                "<br>Fuel Type <t>: " + obj.fuel_type + 
                "<br>" +
                "<table>" +
                    "<tr>" + 
                        "<td>TE</td><td>ECP</td><td>ECF</td><td>TRTX</td><td>RTXF</td>" + 
                    "</tr>" +
                    "<tr>" + 
                        "<td>" + obj.nozzel_event_count + "</td>" +
                        "<td>" + obj.cloud_pushed_event_count + "</td>" +
                        "<td>" + obj.cloud_fail_event_count + "</td>" +
                        "<td>" + obj.retransmitted_event_count + "</td>" +
                        "<td>" + obj.retransmit_failed_event_count + "</td>" +
                    "</tr>" +
                "</table>" +
                "<br>" +
                "<table>" +
                    "<tr>" +
                        "<td><a href='http://" + ipAddress + "' target='_blank'>Home</a></td>" +
                        "<td><a href='http://" + ipAddress + "/getSDFileList' target='_blank'>SD</a></td>" +
                        "<td><a href='http://" + ipAddress + "/getSPIFFSFileList' target='_blank'>SPIFFs</a></td>" +
                        "<td><a href='http://" + ipAddress + "/showFileSD?filename=filelist.csv' target='_blank'>ShowFileSD</a></td>" +
                        "<td><a href='http://" + ipAddress + "/showLogFileSPIFFs?filename=filelist.csv' target='_blank'>ShowFileSPIFFs</a></td>" +
                        "<td><a href='http://" + ipAddress + "/showFileSD?filename="+ date +".log' target='_blank'>Log</a></td>" +
                    "</tr>" +
                    "<tr>" +
                        "<td><a href='http://" + ipAddress + "/showFileSD?filename=event-pumped-"+ date +".log' target='_blank'>EP</a></td>" +
                        "<td><a href='http://" + ipAddress + "/showFileSD?filename=event-cloudfailed-"+ date +".log' target='_blank'>EPF</a></td>" +
                        "<td><a href='http://" + ipAddress + "/showFileSD?filename=restransmitList"+ date +".json' target='_blank'>RTXList</a></td>" +
                        "<td><a href='http://" + ipAddress + "/showFileSD?filename=restransmitStatus.json' target='_blank'>RTXStatus</a></td>" +
                    "</tr>" +
                "</table>" +
                "<br>"
                tag_name_display = document.getElementById("id_tableCell"+ idx +"_live");
                tag_name_display.innerHTML = obj.displayvalue +
                "<br>" + date + "<br>" + time + "<br>";
            }
            else if(this.readyState == 4 && this.status == 0){
                tag_name = document.getElementById("id_tableCell"+ idx +"_allData");
                tag_name.innerHTML = "Nozzel ID :" + name + "<br>TIMEDOUT<br>";
            }
        };
        xhttp.open("GET", "http://"+ipAddress+"/getDeviceInformation", true);
        xhttp.send();
    }

    function getMainThreadCounter(ipAddress, idx){
        
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                var obj = JSON.parse(this.responseText);
                tag_name = document.getElementById("id_tableCell"+ idx +"_main_thread_counter");
                tag_name.innerHTML = obj.main_thread_counter + "<br>";
            }
            else if(this.readyState == 4 && this.status == 0){
                tag_name = document.getElementById("id_tableCell"+ idx +"_main_thread_counter");
                tag_name.innerHTML = "TIMEDOUT <br>"
            }
        };
        xhttp.open("GET", "http://"+ipAddress+"/getMainThreadCounter", true);
        xhttp.send();
    }

    function getDisplayReading(ipAddress, idx, name){
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {

                var today = new Date();

                tag_name = document.getElementById("id_tableCell"+ idx +"_live");
                tag_name.innerHTML = obj.displayvalue +

            }
            else if(this.readyState == 4 && this.status == 0){
                tag_name = document.getElementById("id_tableCell"+ idx +"_live");
                tag_name.innerHTML = "TIMEDOUT"
            }
        };
        xhttp.open("GET", "http://"+ipAddress+"/getDisplayReading", true);
        xhttp.send();
    }

    function getAllDataOnce(){

        for (let i = 0; i < DeviceList.length; i++) {
            let idx = DeviceList[i].idx;
            let ip = DeviceList[i].ipaddress;
            let name = DeviceList[i].nozzelid;
            getData(ip, idx, name);
        }
    }

    function loop(){
        
        for (let i = 0; i < DeviceList.length; i++) {
            let idx = DeviceList[i].idx;
            let ip = DeviceList[i].ipaddress;
            let name = DeviceList[i].nozzelid;
            getDisplayReading(ip, idx, name);
            getMainThreadCounter(ip, idx);
        }
    }
