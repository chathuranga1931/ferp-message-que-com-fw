    var deviceList;

    function displayIcon(file){
        if (file) {
            var reader = new FileReader();

            reader.onload = function (e) {

                var x = document.getElementById("id_iconImage");
                x.src = e.target.result;
            };

            reader.readAsDataURL(file);
        }
    }

    function uploadIconFile(file){

        let xhr = new XMLHttpRequest();
        let formData = new FormData();    
        formData.append("file", file);

        //xhr.onreadystatechange = state => { console.log(xhr.status); } // err handling
        xhr.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                alert(this.responseText);
            }
        };
        xhr.open("POST", '/iconFileupload');  
        xhr.send(formData);
    }

    function SavePhoto(input) {
        
        if (input.files && input.files[0]) {
            iconFile = input.files[0];
            displayIcon(iconFile);
            uploadIconFile(iconFile);
        }
    }  
    
    function goToMenuConfig(){        
        window.location  = "/menuItemConfigurations";
    }

    function modifyMenuItem(){

        var xhttp = new XMLHttpRequest();   

        var tableIndex = document.getElementById("id_tableIndex").innerHTML;
        var UID = document.getElementById("id_deviceUID").innerHTML;
        var matchedUID = 0;
        for(var i=0; deviceList.length; i++){
            if( deviceList[i].id == UID){
                matchedUID = i;
                break;
            }
        }

        var actionList = document.getElementById("id_actionList");
        var command = (deviceList[matchedUID].commands)[actionList.selectedIndex].command;   
        var title = document.getElementById("id_itemTitle").value;
        var iconPath;
        if(iconFile){
            iconPath = iconFile.name;
        }
        else{
            strPath = document.getElementById("id_itemFilePath").innerHTML;
            var res = strPath.split("/");
            iconPath = res[res.length-1];

        }       

        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                alert(this.responseText);
                goToMenuConfig();
            }
        };
        var url = "modifyMenuItem?index=" + tableIndex + "&command=" + command
                                          + "&title="+ title + "&iconPath=" + iconPath
        xhttp.open("GET", url , true);
        xhttp.send();
    }

    function getAllDeviceList(){

        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) { 
                
                try {

                    var obj = JSON.parse(this.responseText);
                    deviceList = JSON.parse(this.responseText);
                    // document.getElementById("id_allDeviceListJson").innerHTML = this.responseText;  

                    if(obj.error == true){
                        alert("Error: Type-" + obj.type + ", Message-" + obj.message);
                        gotoHome();
                        return;
                    }
                    
                    var x = document.getElementById("id_deviceSelect");
                    for(var k=0; k<obj.length; k++){
                        var option = document.createElement("option");
                        option.text = obj[k].name;
                        x.add(option);
                    }
                }
                catch(err){
                    alert("Error: Please check the base URL");
                    gotoHome();
                }

                // let baseURL = obj.base_url;
                // let accessToken = obj.access_token;

                // document.getElementById("id_accessToken").value = accessToken;
                // document.getElementById("id_baseURL").value = baseURL;
                
            }
        };
        xhttp.open("GET", "getDeviceList", true);
        xhttp.send();    
    }

    function itemTableappendRaw(tableIndex, id, icon, title, action){

    function onDeleteMenuItem(index){

    function GetItems(index){

        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {

                var obj = JSON.parse(this.responseText);

                let errorCode = obj.error_code;
                if(errorCode!="0") return;

                let tableSize = obj.table_size;
                let tableIndex = obj.table_index;
                let itemId = obj.item_id;
                let itemCommand = obj.item_command
                let itemTitile = obj.item_title;
                let itemIconFilePath = obj.item_iconFilePath;

                itemTableappendRaw(tableIndex, itemId, itemIconFilePath, itemTitile, itemCommand);

                tableIndex++;
                if(tableIndex < tableSize){
                    GetItems(tableIndex);
                } 
                else{                   
                }               
            }
        };
        xhttp.open("GET", "getMenuConfigTable?index=" + index, true);
        xhttp.send();
    }    

    function loadEditItem(index){

        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {

                var obj = JSON.parse(this.responseText);

                let errorCode = obj.error_code;
                if(errorCode!="0") return;

                let tableSize = obj.table_size;
                let tableIndex = obj.table_index;
                let itemId = obj.item_id;
                let itemCommand = obj.item_command
                let itemTitile = obj.item_title;
                let itemIconFilePath = obj.item_iconFilePath;  
                
                var lbl_tableIndex = document.getElementById("id_tableIndex");
                lbl_tableIndex.innerHTML = tableIndex;

                var lbl_itemFilePath = document.getElementById("id_itemFilePath");
                lbl_itemFilePath.innerHTML = itemIconFilePath;

                var tb_itemTitle = document.getElementById("id_itemTitle");
                tb_itemTitle.value = itemTitile;
                
                var tb_itemID = document.getElementById("id_deviceUID");
                tb_itemID.innerHTML = itemId;

                var tb_itemName = document.getElementById("id_deviceName");
                var matchedUID = 0;
                for(var i=0; deviceList.length; i++){
                    if( deviceList[i].id == itemId){
                        tb_itemName.innerHTML = deviceList[i].name;
                        matchedUID = i;
                        break;
                    }
                }

                var select_actionList = document.getElementById("id_actionList"); 
                select_actionList.innerHTML = "";
                for(var j=0; j<deviceList[matchedUID].commands.length; j++){
                    var option = document.createElement("option");
                    option.text = deviceList[matchedUID].commands[j].command;
                    select_actionList.add(option); 
                }  

                loadIcon(itemIconFilePath);

                //var image_iconImage = document.getElementById("id_iconImage");
                //image_iconImage.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn%3AANd9GcTwKYijx8FAjLzYnE0H_FwD55Ak55hDpjB2UzOXQS9qBdhNsezV&usqp=CAU";
            }
        };
        xhttp.open("GET", "getMenuConfigTable?index=" + index, true);
        xhttp.send();
    }

    function loadIcon(iconpath){

        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {

                //var obj = JSON.parse(this.responseText);

                //this.response

                var image_iconImage = document.getElementById("id_iconImage");
                image_iconImage.src = this.responseURL; //"https://encrypted-tbn0.gstatic.com/images?q=tbn%3AANd9GcTwKYijx8FAjLzYnE0H_FwD55Ak55hDpjB2UzOXQS9qBdhNsezV&usqp=CAU";
            }
        }
        let url = "downloadIcon?iconpath=" + iconpath;
        xhttp.open("GET", url , true);
        xhttp.send();
