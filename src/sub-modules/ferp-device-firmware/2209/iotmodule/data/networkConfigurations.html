<!DOCTYPE html>
<html>
<body onload="onLoadBody()">

<h1>Network Configuration</h1>

<br>

<p>Please don't use & character within the inputs...</p>
<label for="n_baseURL">Base URL :</label>
<input type="text" id="id_baseURL" name="n_baseURL"><br><br>

<label for="n_accessToken">Access Token: </label>
<input type="text" id="id_accessToken" name="n_accessToken"><br><br>

<button onclick="saveConfiguration()">Save Configuration</button>

<br>
<p><a href="/">Home Page</a></p>

<script>
    function saveConfiguration() {

        //alert("Content Saving...");
        var xhttp = new XMLHttpRequest();
        let accessToken = document.getElementById("id_accessToken").value;
        let baseURL = document.getElementById("id_baseURL").value;
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                // alert(this.responseText);
            }
        };
        xhttp.open("GET", "setNetworkConfigurations?baseURL="+ baseURL 
            + "&accessToken=" + accessToken, true);
        xhttp.send();
    }

    /*
     * Neet to get the current settings from the device 
     */
    function onLoadBody(){

        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {

                var obj = JSON.parse(this.responseText);

                let baseURL = obj.base_url;
                let accessToken = obj.access_token;

                document.getElementById("id_accessToken").value = accessToken;
                document.getElementById("id_baseURL").value = baseURL;
                
            }
        };
        xhttp.open("GET", "getNetworkConfigurations", true);
        xhttp.send();
    }
</script>

</body>
</html>
