<script>
    /*
     * Neet to get the current settings from the device 
     */
    function onLoadBody(){

        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {

                var obj = JSON.parse(this.responseText);

                let ssid = obj.ssid;
                let password = obj.password;

                document.getElementById("id_ssid").innerHTML =  obj.ssid;
                document.getElementById("id_ip_address").innerHTML =  obj.ipaddress;
                document.getElementById("id_device_version").innerHTML =  obj.device_version;
                document.getElementById("id_display_value").innerHTML = obj.displayvalue;
            }
        };
        xhttp.open("GET", "getDeviceInformation", true);
        xhttp.send();
    }
</script>
