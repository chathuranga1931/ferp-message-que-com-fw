<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Upload Files</title>
  </head>

  <body>

    <h3>This section use form method to upload a file</h3>
    <FORM action='/upload' method='post' enctype='multipart/form-data'>
        <input class='buttons' style='width:40%' type='file' name='fupload' id = 'fupload' value=''><br>
        <br><button class='buttons' style='width:10%' type='submit'>Upload File</button><br>
    </FORM>

    
    <h3>This uses java script funtion to upload the file</h3>
    <input id="image-file" type="file" onchange="SavePhoto(this)" >

    <h3>This Navigates back</h3>
    <a href='/'>[Back]</a><br><br>


    <script>
        function SavePhoto(e) 
        {
            let xhr = new XMLHttpRequest();
            let formData = new FormData();
            let file = e.files[0];       
            formData.append("file", file);

            //xhr.onreadystatechange = state => { console.log(xhr.status); } // err handling
            xhr.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    alert(this.responseText);
                }
            };
            xhr.open("POST", '/upload');    
            xhr.send(formData);
        }
    </script>

  </body>
</html>
