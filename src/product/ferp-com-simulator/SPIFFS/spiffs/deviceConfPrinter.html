<button class="button button2" onclick="saveConfigurationPost()">Save Configuration</button>

<script>
    function saveConfiguration() {

        //alert("Content Saving...");
        var xhttp = new XMLHttpRequest();
        let ssid = document.getElementById("id_ssid").value;
        let password = document.getElementById("id_password").value;
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                // alert(this.responseText);
            }
        };
        xhttp.open("GET", "setDeviceConfigurations?ssid="+ ssid 
            + "&password=" + password, true);
        xhttp.send();
    }

    function saveConfigurationPost() {

        //alert("Content Saving...");
        var xhttp = new XMLHttpRequest();
        let ssid = document.getElementById("id_ssid").value;
        let password = document.getElementById("id_password").value;
        let print_name_l1 = document.getElementById("id_name_l1").value;
        let print_name_l2 = document.getElementById("id_name_l2").value;
        let print_name_l3 = document.getElementById("id_name_l3").value;
        let print_add_l1 = document.getElementById("id_add_l1").value;
        let print_add_l2 = document.getElementById("id_add_l2").value;
        let print_add_l3 = document.getElementById("id_add_l3").value;
        let print_tele = document.getElementById("id_tele").value;
        let print_thank_l1 = document.getElementById("id_thank_l1").value;
        let print_thank_l2 = document.getElementById("id_thank_l2").value;
        let print_end_lines = document.getElementById("id_end_lines").value;
        let print_baud_rate = document.getElementById("id_baud_rate").value;
        let print_enable_print_time = document.getElementById("id_is_printtime_enabled").checked;
        var data = {
            ssid: ssid,
            password: password,
            print_name_l1: print_name_l1,
            print_name_l2: print_name_l2,
            print_name_l3: print_name_l3,
            print_add_l1: print_add_l1,
            print_add_l2: print_add_l2,
            print_add_l3: print_add_l3,
            print_tele: print_tele,
            print_thank_l1: print_thank_l1,
            print_thank_l2: print_thank_l2,
            print_end_lines: print_end_lines,
            print_baud_rate: print_baud_rate,
            print_enable_print_time: print_enable_print_time
        };
        // alert(JSON.stringify(data));
        xhttp.open("POST", "setDeviceConfigurationsPost", true);
        xhttp.setRequestHeader('Content-type', 'application/json');
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                alert("OK");
            }
        };
        xhttp.send(JSON.stringify(data));
    }

    /*
     * Neet to get the current settings from the device 
     */
    function onLoadBody(){

        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {

                var obj = JSON.parse(this.responseText);

                let ssid = obj.ssid;
                let password = obj.password;

                document.getElementById("id_ssid").value = ssid;
                document.getElementById("id_password").value = password;
                document.getElementById("id_name_l1").value = obj.print_name_l1;
                document.getElementById("id_name_l2").value = obj.print_name_l2;
                document.getElementById("id_name_l3").value = obj.print_name_l3;
                document.getElementById("id_add_l1").value = obj.print_add_l1;
                document.getElementById("id_add_l2").value = obj.print_add_l2;
                document.getElementById("id_add_l3").value = obj.print_add_l3;
                document.getElementById("id_tele").value = obj.print_tele;
                document.getElementById("id_thank_l1").value = obj.print_thank_l1;
                document.getElementById("id_thank_l2").value = obj.print_thank_l2;
                document.getElementById("id_end_lines").value = obj.print_end_lines;
                document.getElementById("id_baud_rate").value = obj.print_baud_rate;
                document.getElementById("id_is_printtime_enabled").checked = obj.print_enable_print_time;
            }
        };
        xhttp.open("GET", "getDeviceConfigurations", true);
        xhttp.send();
    }
</script>
