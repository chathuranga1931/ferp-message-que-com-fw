<script>
    /*
     * Neet to get the current settings from the device 
     */
    function onLoadBody(){

        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {

                var obj = JSON.parse(this.responseText);

                let ssid = obj.ssid;
                let password = obj.password;

                document.getElementById("id_ssid").innerHTML =  obj.ssid;
                document.getElementById("id_rssi").innerHTML =  obj.rssi;
                document.getElementById("id_ip_address").innerHTML =  obj.ipaddress;
                document.getElementById("id_device_version").innerHTML =  obj.device_version;
                document.getElementById("display_tap_version").innerHTML =  obj.display_tap_version;
                document.getElementById("id_display_value_1").innerHTML = obj.displayvalue_0;
                document.getElementById("id_fuel_type_1").innerHTML = obj.fuel_type_0;
                document.getElementById("id_display_value_2").innerHTML = obj.displayvalue_1;
                document.getElementById("id_fuel_type_2").innerHTML = obj.fuel_type_1;
                document.getElementById("id_sd_card_size").innerHTML = obj.sd_card_size;
                document.getElementById("id_power_on_time").innerHTML = obj.power_on_time;
                document.getElementById("id_reset_reason").innerHTML = obj.reset_reason;
            }
        };
        xhttp.open("GET", "getDeviceInformation", true);
        xhttp.send();
    }
</script>
