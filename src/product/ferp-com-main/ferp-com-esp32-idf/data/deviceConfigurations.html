<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body onload="onLoadBody()">
    <div class="topnav">
        <a href="/">Home</a>
        <a class="active" href="/deviceConfigurations">Device Configurations</a>
        <a href="/update" target="_blank">Update Firmware</a>
        <a href="/webserial" target="_blank">Web Serial</a>
        <a href="/contact">Contact</a>
        <a href="/about">About</a>
    </div>

<h1 class="configListheading">WiFi Configurations</h1>
<ul>
    <li class="configListInputLine">
        <label for="n_ssid">SSID :</label>
        <input size="75" type="text" id="id_ssid" name="n_ssid">
    </li>
    <li class="configListInputLine">
        <label for="n_password">Password:</label>
        <input size="75" type="password" id="id_password" name="n_password">
    </li>
    <li class="configListInputLine">
        <label for="n_display_type">Display Type :</label>
        <select id="id_display_type" name="n_display_type"></select>
    </li>
</ul>

<h1 class="configListheading">MQTT Configurations</h1>
<ul>
    <li class="configListInputLine">
        <label for="n_mqtt_host">Host :</label>
        <input size="75" type="text" id="id_mqtt_host" name="n_mqtt_host">
    </li>
    <li class="configListInputLine">
        <label for="n_mqtt_port">Port :</label>
        <input size="10" type="number" id="id_mqtt_port" name="n_mqtt_port">
    </li>
    <li class="configListInputLine">
        <label for="n_mqtt_user">User :</label>
        <input size="40" type="text" id="id_mqtt_user" name="n_mqtt_user">
    </li>
    <li class="configListInputLine">
        <label for="n_mqtt_password">Password :</label>
        <input size="40" type="password" id="id_mqtt_password" name="n_mqtt_password">
    </li>
</ul>

<h1 class="configListheading">Printer Configurations</h1>
<ul>
    <li class="configListInputLine">
        <label for="n_printer_URL">URL :</label>
        <input size="110" type="text" id="id_printer_URL" name="n_printer_URL">
    </li>
    <li class="configListInputLine">
        <label for="n_printer_copy_count">Copy Count :</label>
        <input size="10" type="number" id="id_printer_copy_count" name="n_printer_copy_count">
    </li>
</ul>

<br>
<button class="button button2" onclick="saveConfiguration()">Save Configuration</button>
<br>
<button class="button button2" onclick="reboot()">Reboot</button>
<br>

<script>
    // -------------------------------------------------------------------------
    // Low-level helper: POST /api/messages and return parsed response data.
    // Returns a Promise that resolves to the response data object, or rejects.
    // -------------------------------------------------------------------------
    function apiMsg(msgName, data) {
        return new Promise(function(resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "/api/messages", true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.onreadystatechange = function() {
                if (xhr.readyState !== 4) return;
                if (xhr.status === 200) {
                    try {
                        var resp = JSON.parse(xhr.responseText);
                        if (resp.ok) {
                            resolve(resp.data || {});
                        } else {
                            reject("Device returned error for " + msgName);
                        }
                    } catch(e) {
                        reject("JSON parse error: " + e);
                    }
                } else {
                    reject("HTTP " + xhr.status + " for " + msgName);
                }
            };
            xhr.send(JSON.stringify({ msg: msgName, data: data || {} }));
        });
    }

    // -------------------------------------------------------------------------
    // Helper: fire-and-forget MsgConfigSet for a single key/value pair.
    // type: "string" | "uint32" | "bool"
    // -------------------------------------------------------------------------
    function cfgSet(key, type, value) {
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/messages", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.send(JSON.stringify({
            msg: "MsgConfigSet",
            data: { key: key, type: type, value: String(value) }
        }));
    }

    // -------------------------------------------------------------------------
    // Populate display-type dropdown
    // -------------------------------------------------------------------------
    function populateDisplayType(selectedIndex) {
        var items = ["None", "Censtar-6", "Censtar-7", "Censtar-8",
                     "Hongyang-7", "Wayne-6", "Sanki-6"];
        var sel = document.getElementById("id_display_type");
        sel.innerHTML = "";
        items.forEach(function(item) {
            var opt = document.createElement("option");
            opt.value = item;
            opt.text  = item;
            sel.appendChild(opt);
        });
        sel.selectedIndex = selectedIndex || 0;
    }

    // -------------------------------------------------------------------------
    // onLoadBody — fetch all config sections via message bus
    // -------------------------------------------------------------------------
    function onLoadBody() {
        // WiFi — via message bus (MsgConfigGetWifi → MsgConfigWifi)
        apiMsg("MsgConfigGetWifi", {}).then(function(d) {
            document.getElementById("id_ssid").value     = d.ssid     || "";
            document.getElementById("id_password").value = d.password || "";
        }).catch(function(e) { console.error("WiFi fetch failed:", e); });

        // MQTT — via message bus (MsgConfigGetMqtt → MsgConfigMqtt)
        apiMsg("MsgConfigGetMqtt", {}).then(function(d) {
            document.getElementById("id_mqtt_host").value     = d.host     || "";
            document.getElementById("id_mqtt_port").value     = d.port     || 1883;
            document.getElementById("id_mqtt_user").value     = d.user     || "";
            document.getElementById("id_mqtt_password").value = d.password || "";
        }).catch(function(e) { console.error("MQTT fetch failed:", e); });

        // Hardware / printer fields — via GET /api/config (raw config JSON)
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "/api/config", true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4 || xhr.status !== 200) return;
            try {
                var d = JSON.parse(xhr.responseText);
                populateDisplayType(d.display_type || 0);
                document.getElementById("id_printer_URL").value        = d.printer_url || "";
                document.getElementById("id_printer_copy_count").value = d.p_cpy_cnt   || 1;
            } catch(e) {
                console.error("Config fetch failed:", e);
                populateDisplayType(0);
            }
        };
        xhr.send();
    }

    // -------------------------------------------------------------------------
    // saveConfiguration — send one MsgConfigSet per changed key
    // -------------------------------------------------------------------------
    function saveConfiguration() {
        // WiFi
        cfgSet("ssid",          "string",  document.getElementById("id_ssid").value);
        cfgSet("password",      "string",  document.getElementById("id_password").value);
        cfgSet("display_type",  "uint32",  document.getElementById("id_display_type").selectedIndex);

        // MQTT
        cfgSet("mqtt_host",     "string",  document.getElementById("id_mqtt_host").value);
        cfgSet("mqtt_port",     "uint32",  document.getElementById("id_mqtt_port").value);
        cfgSet("mqtt_user",     "string",  document.getElementById("id_mqtt_user").value);
        cfgSet("mqtt_pass",     "string",  document.getElementById("id_mqtt_password").value);

        // Printer
        cfgSet("printer_url",   "string",  document.getElementById("id_printer_URL").value);
        cfgSet("p_cpy_cnt",     "uint32",  document.getElementById("id_printer_copy_count").value);

        alert("Configuration saved.");
    }

    // -------------------------------------------------------------------------
    // reboot
    // -------------------------------------------------------------------------
    function reboot() {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "reboot", true);
        xhr.setRequestHeader("Content-type", "application/json");
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) { alert("Rebooting..."); }
        };
        xhr.send();
    }
</script>
