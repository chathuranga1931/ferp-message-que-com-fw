<h1 class="configListheading">WiFi Configurations</h1>

<h1 class="configListheading">MQTT Configurations</h1>
<ul>

        <label for="n_mqtt_host">Host :</label>

    <li class="configListInputLine">

    </li>
</ul>

<h1 class="configListheading">Printer Configurations</h1>
<ul>
    <li class="configListInputLine">
        <label for="n_printer_URL">URL :</label>
        <input size="110" type="text" id="id_printer_URL" name="n_printer_URL">
    </li>
    <li class="configListInputLine">
        <label for="n_printer_copy_count">Copy Count :</label>
        <input size="10" type="number" id="id_printer_copy_count" name="n_printer_copy_count">
    </li>
</ul>

<br>
<button class="button button2" onclick="saveConfiguration()">Save Configuration</button>
<br>
<button class="button button2" onclick="reboot()">Reboot</button>
<br>

<script>
    // =========================================================================
    // CFG_KEY_* constants  (must match app_config.h)
    // =========================================================================
    var CFG_KEY_WIFI_SSID            = 0x1001;
    var CFG_KEY_WIFI_PASSWORD        = 0x1002;
    var CFG_KEY_CLOUD_URL            = 0x2001;
    var CFG_KEY_CLOUD_SECRET         = 0x2002;
    var CFG_KEY_CLOUD_HB_ENABLED     = 0x2003;
    var CFG_KEY_CLOUD_HB_INTERVAL_S  = 0x2004;
    var CFG_KEY_OTA_SERVER_URL       = 0x3001;
    var CFG_KEY_OTA_CHECK_INTERVAL_S = 0x3002;
    var CFG_KEY_MQTT_HOST            = 0x4001;
    var CFG_KEY_MQTT_PORT            = 0x4002;
    var CFG_KEY_MQTT_USER            = 0x4003;
    var CFG_KEY_MQTT_PASSWORD        = 0x4004;
    var CFG_KEY_DISPLAY_TYPE         = 0x6001;
    var CFG_KEY_STABILIZE_DELAY_MS   = 0x6002;
    var CFG_KEY_EN_RETX              = 0x6003;
    var CFG_KEY_NOZZLE_SWAP          = 0x6004;
    var CFG_KEY_TOT_CNT              = 0x6005;
    var CFG_KEY_TOT_DUR              = 0x6006;
    var CFG_KEY_PRINTER_URL          = 0x7001;
    var CFG_KEY_PRINTER_COPY_COUNT   = 0x7002;
    var CFG_KEY_PRINT_DELAY_MS       = 0x7003;
    var CFG_KEY_LOG_UDP_ENABLED      = 0x8001;
    var CFG_KEY_LOG_UDP_SERVER_IP    = 0x8002;
    var CFG_KEY_LOG_UDP_PORT         = 0x8003;
    var CFG_KEY_DT_LOG_RATE          = 0x8004;
    var CFG_KEY_ENABLE_NID_PRINT     = 0x9001;
    var CFG_KEY_ENABLE_NID_CLOUD     = 0x9002;

    // Type constants  (must match hsys_type_t)
    var TYPE_STRING = 0;
    var TYPE_UINT32 = 1;
    var TYPE_BOOL   = 2;

    // =========================================================================
    // Binary encode helpers
    // =========================================================================

    // String → byte array  (UTF-8, no NUL terminator sent — size carries length)
    function encodeString(str) {
        var bytes = [];
        for (var i = 0; i < str.length; i++) {
            var code = str.charCodeAt(i);
            if (code < 0x80) {
                bytes.push(code);
            } else if (code < 0x800) {
                bytes.push(0xC0 | (code >> 6));
                bytes.push(0x80 | (code & 0x3F));
            } else {
                bytes.push(0xE0 | (code >> 12));
                bytes.push(0x80 | ((code >> 6) & 0x3F));
                bytes.push(0x80 | (code & 0x3F));
            }
        }
        return bytes;
    }

    // uint32 → 4 bytes LE
    function encodeUint32(v) {
        v = v >>> 0;
        return [v & 0xFF, (v >> 8) & 0xFF, (v >> 16) & 0xFF, (v >> 24) & 0xFF];
    }

    // bool → 1 byte
    function encodeBool(v) { return [v ? 1 : 0]; }

    // =========================================================================
    // Binary decode helpers
    // =========================================================================

    // byte array → string  (trim trailing NUL bytes)
    function decodeString(arr) {
        var s = "";
        for (var i = 0; i < arr.length; i++) {
            if (arr[i] === 0) break;
            s += String.fromCharCode(arr[i]);
        }
        return s;
    }

    // 4 bytes LE → uint32
    function decodeUint32(arr) {
        if (!arr || arr.length < 4) return 0;
        return ((arr[3] << 24) | (arr[2] << 16) | (arr[1] << 8) | arr[0]) >>> 0;
    }

    // 1 byte → bool
    function decodeBool(arr) { return arr && arr[0] !== 0; }

    // =========================================================================
    // Low-level helper: POST /api/messages, return parsed response data.
    // =========================================================================
    function apiMsg(msgName, data) {
        return new Promise(function(resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "/api/messages", true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.onreadystatechange = function() {
                if (xhr.readyState !== 4) return;
                if (xhr.status === 200) {
                    try {
                        var resp = JSON.parse(xhr.responseText);
                        if (resp.ok) {
                            resolve(resp.data || {});
                        } else {
                            reject("Device returned error for " + msgName);
                        }
                    } catch(e) {
                        reject("JSON parse error: " + e);
                    }
                } else {
                    reject("HTTP " + xhr.status + " for " + msgName);
                }
            };
            xhr.send(JSON.stringify({ msg: msgName, data: data || {} }));
        });
    }

    // =========================================================================
    // cfgGet(key)  → Promise<JS value>
    // Sends MsgConfigGetKey, receives MsgConfigValue, decodes based on type.
    // =========================================================================
    function cfgGet(key) {
        return apiMsg("MsgConfigGetKey", { key: key }).then(function(d) {
            var arr  = d.data  || [];
            var type = d.type;
            if (type === TYPE_UINT32) return decodeUint32(arr);
            if (type === TYPE_BOOL)   return decodeBool(arr);
            return decodeString(arr);
        });
    }

    // =========================================================================
    // cfgSet(key, type, jsValue)  → fire-and-forget
    // =========================================================================
    function cfgSet(key, type, jsValue) {
        var bytes;
        if (type === TYPE_UINT32) {
            bytes = encodeUint32(parseInt(jsValue, 10) || 0);
        } else if (type === TYPE_BOOL) {
            bytes = encodeBool(!!jsValue);
        } else {
            bytes = encodeString(String(jsValue));
        }
        apiMsg("MsgConfigSet", {
            key:  key,
            type: type,
            size: bytes.length,
            data: bytes
        }).catch(function(e) { console.error("cfgSet key=0x" + key.toString(16) + " failed:", e); });
    }

    // =========================================================================
    // Populate display-type dropdown
    // =========================================================================
    function populateDisplayType(selectedIndex) {
        var items = ["None", "Censtar-6", "Censtar-7", "Censtar-8",
                     "Hongyang-7", "Wayne-6", "Sanki-6"];
        var sel = document.getElementById("id_display_type");
        sel.innerHTML = "";
        items.forEach(function(item) {
            var opt = document.createElement("option");
            opt.value = item;
            opt.text  = item;
            sel.appendChild(opt);
        });
        sel.selectedIndex = selectedIndex || 0;
    }

    // =========================================================================
    // onLoadBody — fetch each config field individually by CFG_KEY_*
    // =========================================================================
    function onLoadBody() {
        cfgGet(CFG_KEY_WIFI_SSID).then(function(v) {
            document.getElementById("id_ssid").value = v;
        }).catch(function(e) { console.error("ssid:", e); });

        cfgGet(CFG_KEY_WIFI_PASSWORD).then(function(v) {
            document.getElementById("id_password").value = v;
        }).catch(function(e) { console.error("password:", e); });

        cfgGet(CFG_KEY_DISPLAY_TYPE).then(function(v) {
            populateDisplayType(v);
        }).catch(function(e) { populateDisplayType(0); console.error("display_type:", e); });

        cfgGet(CFG_KEY_MQTT_HOST).then(function(v) {
            document.getElementById("id_mqtt_host").value = v;
        }).catch(function(e) { console.error("mqtt_host:", e); });

        cfgGet(CFG_KEY_MQTT_PORT).then(function(v) {
            document.getElementById("id_mqtt_port").value = v || 1883;
        }).catch(function(e) { console.error("mqtt_port:", e); });

        cfgGet(CFG_KEY_MQTT_USER).then(function(v) {
            document.getElementById("id_mqtt_user").value = v;
        }).catch(function(e) { console.error("mqtt_user:", e); });

        cfgGet(CFG_KEY_MQTT_PASSWORD).then(function(v) {
            document.getElementById("id_mqtt_password").value = v;
        }).catch(function(e) { console.error("mqtt_password:", e); });

        cfgGet(CFG_KEY_PRINTER_URL).then(function(v) {
            document.getElementById("id_printer_URL").value = v;
        }).catch(function(e) { console.error("printer_url:", e); });

        cfgGet(CFG_KEY_PRINTER_COPY_COUNT).then(function(v) {
            document.getElementById("id_printer_copy_count").value = v || 1;
        }).catch(function(e) { console.error("printer_copy_count:", e); });
    }

    // =========================================================================
    // saveConfiguration — send one MsgConfigSet per field
    // =========================================================================
    function saveConfiguration() {
        cfgSet(CFG_KEY_WIFI_SSID,          TYPE_STRING, document.getElementById("id_ssid").value);
        cfgSet(CFG_KEY_WIFI_PASSWORD,      TYPE_STRING, document.getElementById("id_password").value);
        cfgSet(CFG_KEY_DISPLAY_TYPE,       TYPE_UINT32, document.getElementById("id_display_type").selectedIndex);
        cfgSet(CFG_KEY_MQTT_HOST,          TYPE_STRING, document.getElementById("id_mqtt_host").value);
        cfgSet(CFG_KEY_MQTT_PORT,          TYPE_UINT32, document.getElementById("id_mqtt_port").value);
        cfgSet(CFG_KEY_MQTT_USER,          TYPE_STRING, document.getElementById("id_mqtt_user").value);
        cfgSet(CFG_KEY_MQTT_PASSWORD,      TYPE_STRING, document.getElementById("id_mqtt_password").value);
        cfgSet(CFG_KEY_PRINTER_URL,        TYPE_STRING, document.getElementById("id_printer_URL").value);
        cfgSet(CFG_KEY_PRINTER_COPY_COUNT, TYPE_UINT32, document.getElementById("id_printer_copy_count").value);
        alert("Configuration saved.");
    }

    // =========================================================================
    // reboot
    // =========================================================================
    function reboot() {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "reboot", true);
        xhr.setRequestHeader("Content-type", "application/json");
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) { alert("Rebooting..."); }
        };
        xhr.send();
    }
</script>
