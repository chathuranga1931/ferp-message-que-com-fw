[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferp-core"
version = "0.1.0"
description = "Shared FERP device protocol logic: transports, OTA, message definitions, MQTT auth"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5.0"]

[tool.setuptools.packages.find]
include = ["ferp_core*"]

[tool.setuptools.package-data]
ferp_core = ["data/*.json"]
